<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayHub | Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .form-card {
        max-width: 480px;
        margin: 4rem auto;
        padding: 2.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .form-card h1 {
        margin-bottom: 0.3rem;
      }

      .form-card .subtitle {
        color: var(--muted);
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .form-group {
        margin-bottom: 1.3rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.4rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        color: var(--accent-2);
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 0.95rem;
        transition: border-color 180ms ease;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--accent);
      }

      .form-group select option {
        background: #0b1020;
        color: var(--text);
      }

      .form-actions {
        display: flex;
        gap: 0.8rem;
        margin-top: 2rem;
      }

      .form-actions .button {
        flex: 1;
      }

      .message {
        display: none;
        padding: 1rem;
        border-radius: 14px;
        margin-bottom: 1.5rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.85rem;
      }

      .message.success {
        display: block;
        background: rgba(77, 208, 225, 0.12);
        border: 1px solid rgba(77, 208, 225, 0.3);
        color: #4dd0e1;
      }

      .message.error {
        display: block;
        background: rgba(255, 77, 77, 0.12);
        border: 1px solid rgba(255, 77, 77, 0.3);
        color: #ff6b6b;
      }

      .spinner {
        display: none;
      }

      .button.loading .spinner {
        display: inline-block;
      }

      .button.loading .btn-text {
        display: none;
      }

      .brand-row {
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="backdrop backdrop-a"></div>
    <div class="backdrop backdrop-b"></div>

    <main class="shell">
      <header class="hero reveal" style="padding: 0; border: none; background: none; box-shadow: none; backdrop-filter: none;">
        <div class="brand-row" style="margin-bottom: 0;">
          <a href="index.html" style="text-decoration: none; display: flex; gap: 1rem; align-items: center; color: inherit;">
            <div class="brand-mark" aria-hidden="true">SH</div>
            <div>
              <p class="eyebrow">StayHub</p>
              <h1>Crear cuenta</h1>
            </div>
          </a>
        </div>
      </header>

      <div class="form-card reveal" style="--delay: 100ms">
        <div id="message" class="message"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez" />
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required placeholder="juanperez2026@gmail.com" />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres" />
          </div>

          <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
              <option value="" disabled selected>Seleccioná un rol</option>
              <option value="huesped">Huésped</option>
              <option value="anfitrion">Anfitrión</option>
              <option value="admin">Administrador</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="button button-primary" id="btn-submit">
              <span class="btn-text">Registrarse</span>
              <span class="spinner">⟳</span>
            </button>
            <a href="index.html" class="button button-secondary">Volver</a>
          </div>
        </form>
      </div>
    </main>

    <script src="register.js"></script>
  </body>
</html>
